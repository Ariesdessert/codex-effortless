# codex-effortless settings. Environment variables of the same name override these.

# warn: show a suggestion when the judge disagrees with the current effort (default)
# block: hold the prompt back when the judge wants a higher effort, so you can raise it and resend
# off: do nothing
EFFORTLESS_MODE=${EFFORTLESS_MODE:-warn}

# In block mode, how many levels higher the verdict must be before the prompt is held back.
EFFORTLESS_BLOCK_GAP=${EFFORTLESS_BLOCK_GAP:-1}

# The judge model, run on your Codex login.
EFFORTLESS_MODEL=${EFFORTLESS_MODEL:-gpt-5.6-luna}

# Suggestions never go below MIN or above MAX (low, medium, high, xhigh).
EFFORTLESS_MIN=${EFFORTLESS_MIN:-medium}
EFFORTLESS_MAX=${EFFORTLESS_MAX:-xhigh}

# -2 (cheaper) to 2 (smarter): tips the judge's close calls that way; sure calls stay. 0: as judged.
EFFORTLESS_BIAS=${EFFORTLESS_BIAS:-0}

# Seconds the judge may take before the prompt goes through without a verdict.
EFFORTLESS_TIMEOUT=${EFFORTLESS_TIMEOUT:-20}

# --- Optional: judge through an OpenAI-compatible API (OpenRouter, OpenAI, a relay) ---
# Leave the URL empty to judge on your Codex login (the default). Set both a URL and a key to use the API.
# Base URL; /chat/completions is added unless the URL already ends with it.
EFFORTLESS_API_URL=${EFFORTLESS_API_URL:-}           # e.g. https://openrouter.ai/api/v1
# The key itself, or the name of an environment variable holding it (safer: keeps it out of this file).
EFFORTLESS_API_KEY=${EFFORTLESS_API_KEY:-}
EFFORTLESS_API_KEY_ENV=${EFFORTLESS_API_KEY_ENV:-}   # e.g. OPENROUTER_API_KEY
# Model name as the endpoint knows it: openai/gpt-5.6-luna on OpenRouter, gpt-5.6-luna on OpenAI.
EFFORTLESS_API_MODEL=${EFFORTLESS_API_MODEL:-openai/gpt-5.6-luna}
# chat: POST /chat/completions (default). responses: POST /responses (OpenAI Responses API).
# A URL ending in /chat/completions or /responses picks the style by itself.
EFFORTLESS_API_STYLE=${EFFORTLESS_API_STYLE:-chat}
# Reasoning effort for the judge model, e.g. none or low. Empty: the endpoint default (not every model accepts it).
EFFORTLESS_API_REASONING=${EFFORTLESS_API_REASONING:-}
# schema: strict JSON schema (default). object: plain JSON mode, for endpoints that reject schemas. none: neither.
EFFORTLESS_API_FORMAT=${EFFORTLESS_API_FORMAT:-schema}
# codex: when the API fails, judge on the Codex login instead (default). none: let the prompt through.
EFFORTLESS_FALLBACK=${EFFORTLESS_FALLBACK:-codex}
