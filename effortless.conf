# codex-effortless settings. Environment variables of the same name override these.
# `$effortless settings` in Codex shows them; `effortless config set KEY VALUE` changes one.

# auto: started through `codex-auto` (or Codex Desktop with Auto on, on Windows), every prompt runs at the effort
#       the judge picks. Started as plain `codex`, a prompt that needs a higher effort is held back once, so you can
#       raise it and press Enter again (the text stays in the box); a lower one is only suggested. (default)
# block: the same as auto (the name earlier versions used for holding prompts back)
# warn: never switch and never hold back; only say which effort to switch to
# off: effortless does nothing
EFFORTLESS_MODE=${EFFORTLESS_MODE:-auto}

# Who judges. auto: Luna, and Jev first when a TypeSafe key is set. luna: never Jev.
# jev: Jev first, and its key may also come from ~/.config/jev/.env.
EFFORTLESS_JUDGE=${EFFORTLESS_JUDGE:-auto}
# TypeSafe key for Jev (or set TYPESAFE_API_KEY). Kept out of logs; this file is private to you.
EFFORTLESS_TYPESAFE_KEY=${EFFORTLESS_TYPESAFE_KEY:-}

# The judge model, run on your Codex login.
EFFORTLESS_MODEL=${EFFORTLESS_MODEL:-gpt-5.6-luna}

# Auto never picks below MIN or above MAX (low, medium, high, xhigh, max). Efforts the model does not take
# are skipped to the nearest one it does.
EFFORTLESS_MIN=${EFFORTLESS_MIN:-low}
EFFORTLESS_MAX=${EFFORTLESS_MAX:-max}

# -2 (cheaper) to 2 (smarter): tips the judge's close calls that way; sure calls stay. 0: as judged.
EFFORTLESS_BIAS=${EFFORTLESS_BIAS:-0}

# In block mode, how many levels higher the verdict must be before the prompt is held back.
EFFORTLESS_BLOCK_GAP=${EFFORTLESS_BLOCK_GAP:-1}

# Seconds the judge may take before the prompt goes on at the effort it had.
EFFORTLESS_TIMEOUT=${EFFORTLESS_TIMEOUT:-20}

# --- Alerts ---
# The cache counts as cold after this many idle minutes (measured on Codex: warm for about 20-30 minutes).
EFFORTLESS_COLD_MINUTES=${EFFORTLESS_COLD_MINUTES:-30}
# block: hold the first prompt into a cold chat of at least COLD_TOKENS once, so you can /compact or hand off first;
# warn: only say it; off: neither.
EFFORTLESS_COLD=${EFFORTLESS_COLD:-block}
EFFORTLESS_COLD_TOKENS=${EFFORTLESS_COLD_TOKENS:-150000}
# Say the chat is swamped once its context fills this percent of the window.
EFFORTLESS_SWAMP_AT=${EFFORTLESS_SWAMP_AT:-50}
# Say you are running hot once a 5-hour or weekly limit passes this percent: once for that window, in any chat,
# and once more at 95%.
EFFORTLESS_HOT_AT=${EFFORTLESS_HOT_AT:-80}
# From this percent of context, every HANDOFF_EVERY messages, the judge says whether a fresh chat would pay off. off: never.
EFFORTLESS_HANDOFF_FROM=${EFFORTLESS_HANDOFF_FROM:-30}
EFFORTLESS_HANDOFF_EVERY=${EFFORTLESS_HANDOFF_EVERY:-2}
# A skill that writes the Full handoff instead of the built-in one, e.g. session-handoff. Empty: the built-in one.
EFFORTLESS_HANDOFF_SKILL=${EFFORTLESS_HANDOFF_SKILL:-}
# After a handoff is saved. continue: /new, then $effortless resume carries on. confirm: the new chat says where
# things stand and waits. copy: the handoff also goes to the clipboard.
EFFORTLESS_HANDOFF_AFTER=${EFFORTLESS_HANDOFF_AFTER:-continue}
# Comma-separated parts to switch off: reason (the judge's reason on an Auto switch), and the alerts swamp (context),
# hot (running low) and cold (cold cache).
EFFORTLESS_HIDE=${EFFORTLESS_HIDE:-reason}
# changes: speak only when there is something to say. always: also a status line on every prompt
# (effort, context, cache, limits), like the original's bar.
EFFORTLESS_BAR=${EFFORTLESS_BAR:-changes}
# Look for a new version of the repo you installed from, at most every 6 hours (git fetch). off: never.
EFFORTLESS_UPDATE_CHECK=${EFFORTLESS_UPDATE_CHECK:-on}

